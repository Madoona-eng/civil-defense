<div class="licensing-edit" dir="rtl">
  <div class="page-header">
    <div>
      <h2>{{ 'licensing.editTitle' | t }}</h2>
      <p>{{ 'licensing.editDescription' | t }}</p>
    </div>
  </div>

  <div class="form-card">
    <div class="loading-box" *ngIf="loading">
      {{ 'common.loadingDataWithEllipsis' | t }}
    </div>

    <ng-container *ngIf="!loading">
      <div class="form-grid">
        <div class="field">
          <label>{{ 'common.submissionDate' | t }}</label>
          <input type="date" [(ngModel)]="formModel.submissionDate" name="submissionDate" />
        </div>

        <div class="field">
          <label>{{ 'common.entity' | t }}</label>
          <select [(ngModel)]="formModel.requestingEntityId" name="requestingEntityId">
            <option value="">{{ 'common.chooseEntity' | t }}</option>
            <option *ngFor="let item of requestingEntities" [value]="item.id">
              {{ item.name }}
            </option>
          </select>
        </div>

        <div class="field">
          <label>{{ 'common.establishmentName' | t }}</label>
          <input type="text" [(ngModel)]="formModel.establishmentName" name="establishmentName" />
        </div>

        <div class="field">
          <label>{{ 'common.establishmentAddress' | t }}</label>
          <input type="text" [(ngModel)]="formModel.establishmentAddress" name="establishmentAddress" />
        </div>

        <div class="field">
          <label>{{ 'common.district' | t }}</label>
          <select [(ngModel)]="formModel.districtId" name="districtId">
            <option value="">{{ 'common.chooseDistrict' | t }}</option>
            <option *ngFor="let item of districts" [value]="item.id">
              {{ item.name }}
            </option>
          </select>
        </div>

        <div class="field">
          <label>{{ 'common.activity' | t }}</label>
          <select [(ngModel)]="formModel.activityTypeId" name="activityTypeId">
            <option value="">{{ 'common.chooseActivity' | t }}</option>
            <option *ngFor="let item of activityTypes" [value]="item.id">
              {{ item.name }}
            </option>
          </select>
        </div>

        <div class="field">
          <label>{{ 'common.applicantName' | t }}</label>
          <input type="text" [(ngModel)]="formModel.applicantName" name="applicantName" />
        </div>

        <div class="field">
          <label>{{ 'common.applicantRole' | t }}</label>
          <input type="text" [(ngModel)]="formModel.applicantRole" name="applicantRole" />
        </div>

        <div class="field">
          <label>{{ 'common.nationalId' | t }}</label>
          <input type="text" [(ngModel)]="formModel.nationalId" name="nationalId" />
        </div>

        <div class="field">
          <label>{{ 'common.responsibleManager' | t }}</label>
          <input type="text" [(ngModel)]="formModel.responsibleManager" name="responsibleManager" />
        </div>

        <div class="field">
          <label>{{ 'common.phone' | t }}</label>
          <input type="text" [(ngModel)]="formModel.phone" name="phone" />
        </div>

        <div class="field">
          <label>{{ 'common.entityLetters' | t }}</label>
          <input type="file" multiple (change)="onFilesSelected($event, 'entityLetters')" />
        </div>

        <div class="field">
          <label>{{ 'common.proofDocuments' | t }}</label>
          <input type="file" multiple (change)="onFilesSelected($event, 'proofDocuments')" />
        </div>

        <div class="field">
          <label>{{ 'common.engineeringReports' | t }}</label>
          <input type="file" multiple (change)="onFilesSelected($event, 'engineeringReports')" />
        </div>

        <div class="field">
          <label>{{ 'common.otherAttachments' | t }}</label>
          <input type="file" multiple (change)="onFilesSelected($event, 'otherAttachments')" />
        </div>
      </div>

      <div class="message success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="message error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="actions">
        <button type="button" class="save-btn" (click)="save()" [disabled]="saving">
          {{ saving ? ('common.saving' | t) : ('common.saveEdit' | t) }}
        </button>

        <button type="button" class="cancel-btn" (click)="cancel()">
          {{ 'common.cancel' | t }}
        </button>
      </div>
    </ng-container>
  </div>
</div>
