<div class="licensing-add" dir="rtl">
  <div class="page-header">
    <div>
      <h2>{{ 'licensing.addTitle' | t }}</h2>
      <p>{{ 'licensing.addDescription' | t }}</p>
    </div>
  </div>

  <div class="form-card">
    <div class="loading-box" *ngIf="loadingLookups">
      {{ 'licensing.loadingLists' | t }}
    </div>

    <div class="form-grid" *ngIf="!loadingLookups">
      <div class="field">
        <label>{{ 'common.submissionDate' | t }}</label>
        <input type="date" [(ngModel)]="formModel.submissionDate" name="submissionDate" />
      </div>

      <div class="field">
        <label>{{ 'common.entity' | t }}</label>
        <select [(ngModel)]="formModel.requestingEntityId" name="requestingEntityId">
          <option value="">{{ 'common.chooseEntity' | t }}</option>
          <option *ngFor="let item of requestingEntities" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
      </div>

      <div class="field">
        <label>{{ 'common.establishmentName' | t }}</label>
        <input type="text" [(ngModel)]="formModel.establishmentName" name="establishmentName" [placeholder]="'common.establishmentName' | t" />
      </div>

      <div class="field">
        <label>{{ 'common.establishmentAddress' | t }}</label>
        <input type="text" [(ngModel)]="formModel.establishmentAddress" name="establishmentAddress" [placeholder]="'common.establishmentAddress' | t" />
      </div>

      <div class="field">
        <label>{{ 'common.district' | t }}</label>
        <select [(ngModel)]="formModel.districtId" name="districtId">
          <option value="">{{ 'common.chooseDistrict' | t }}</option>
          <option *ngFor="let item of districts" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
      </div>

      <div class="field">
        <label>{{ 'common.activity' | t }}</label>
        <select [(ngModel)]="formModel.activityTypeId" name="activityTypeId">
          <option value="">{{ 'common.chooseActivity' | t }}</option>
          <option *ngFor="let item of activityTypes" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
      </div>

      <div class="field">
        <label>{{ 'common.applicantName' | t }}</label>
        <input type="text" [(ngModel)]="formModel.applicantName" name="applicantName" [placeholder]="'common.applicantName' | t" />
      </div>

      <div class="field">
        <label>{{ 'common.applicantRole' | t }}</label>
        <input type="text" [(ngModel)]="formModel.applicantRole" name="applicantRole" placeholder="Owner" />
      </div>

      <div class="field">
        <label>{{ 'common.nationalId' | t }}</label>
        <input type="text" [(ngModel)]="formModel.nationalId" name="nationalId" [placeholder]="'common.nationalIdPlaceholder' | t" />
      </div>

      <div class="field">
        <label>{{ 'common.responsibleManager' | t }}</label>
        <input type="text" [(ngModel)]="formModel.responsibleManager" name="responsibleManager" [placeholder]="'common.managerNamePlaceholder' | t" />
      </div>

      <div class="field">
        <label>{{ 'common.phone' | t }}</label>
        <input type="text" [(ngModel)]="formModel.phone" name="phone" [placeholder]="'common.phonePlaceholder' | t" />
      </div>

      <div class="field">
        <label>{{ 'common.entityLetters' | t }}</label>
        <input type="file" multiple (change)="onFilesSelected($event, 'entityLetters')" />
        <div class="file-list" *ngIf="entityLetters.length > 0">
          <div class="file-item" *ngFor="let file of entityLetters; let i = index">
            <span class="file-name">📄 {{ file.name }}</span>
            <button type="button" class="remove-btn" (click)="removeFile('entityLetters', i)">×</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>{{ 'common.proofDocuments' | t }}</label>
        <input type="file" multiple (change)="onFilesSelected($event, 'proofDocuments')" />
        <div class="file-list" *ngIf="proofDocuments.length > 0">
          <div class="file-item" *ngFor="let file of proofDocuments; let i = index">
            <span class="file-name">📄 {{ file.name }}</span>
            <button type="button" class="remove-btn" (click)="removeFile('proofDocuments', i)">×</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>{{ 'common.engineeringReports' | t }}</label>
        <input type="file" multiple (change)="onFilesSelected($event, 'engineeringReports')" />
        <div class="file-list" *ngIf="engineeringReports.length > 0">
          <div class="file-item" *ngFor="let file of engineeringReports; let i = index">
            <span class="file-name">📄 {{ file.name }}</span>
            <button type="button" class="remove-btn" (click)="removeFile('engineeringReports', i)">×</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>{{ 'common.otherAttachments' | t }}</label>
        <input type="file" multiple (change)="onFilesSelected($event, 'otherAttachments')" />
        <div class="file-list" *ngIf="otherAttachments.length > 0">
          <div class="file-item" *ngFor="let file of otherAttachments; let i = index">
            <span class="file-name">📄 {{ file.name }}</span>
            <button type="button" class="remove-btn" (click)="removeFile('otherAttachments', i)">×</button>
          </div>
        </div>
      </div>
    </div>

    <div class="message success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="message error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="actions">
      <button type="button" class="save-btn" (click)="save()" [disabled]="saving">
        {{ saving ? ('common.saving' | t) : ('licensing.save' | t) }}
      </button>

      <button type="button" class="cancel-btn" (click)="cancel()">
        {{ 'common.cancel' | t }}
      </button>
    </div>
  </div>
</div>
