<div class="welcome-card">
  <h3>{{ 'dashboard.mainTitle' | t }}</h3>
  <p>
    {{ 'dashboard.description' | t }}
  </p>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <span>📄</span>
    <h4>120</h4>
    <p>{{ 'dashboard.totalRequests' | t }}</p>
  </div>

  <div class="stat-card">
    <span>⏳</span>
    <h4>34</h4>
    <p>{{ 'dashboard.underReview' | t }}</p>
  </div>

  <div class="stat-card">
    <span>✅</span>
    <h4>76</h4>
    <p>{{ 'dashboard.completedInspections' | t }}</p>
  </div>

  <div class="stat-card">
    <span>❌</span>
    <h4>10</h4>
    <p>{{ 'dashboard.rejectedRequests' | t }}</p>
  </div>
</div>
