<section class="dashboard-layout" dir="rtl">
  <aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-brand">
      <div class="logo">🛡️</div>
      <div class="brand-text">
        <h3>الحماية المدنية</h3>
        <span>لوحة التحكم</span>
      </div>
      <button class="collapse-btn" type="button" (click)="toggleSidebar()">
        <lucide-angular
          [img]="isCollapsed ? PanelRightOpen : PanelLeftOpen"
          [size]="18"
        ></lucide-angular>
      </button>
    </div>

    <nav class="sidebar-menu">
      <a
        *ngIf="hasRole(['Admin'])"
        routerLink="/civil-defense/activity-types"
        routerLinkActive="active"
        [matTooltip]="isCollapsed ? 'أنواع النشاط' : ''"
        matTooltipPosition="left"
      >
        <lucide-angular class="icon" [img]="Tags" [size]="18"></lucide-angular>
        <span class="label">أنواع النشاط</span>
      </a>

      <a
        *ngIf="hasRole(['Admin'])"
        routerLink="/civil-defense/requesting-entities"
        routerLinkActive="active"
        [matTooltip]="isCollapsed ? 'الجهات الطالبة' : ''"
        matTooltipPosition="left"
      >
        <lucide-angular
          class="icon"
          [img]="Building2"
          [size]="18"
        ></lucide-angular>
        <span class="label">الجهات الطالبة</span>
      </a>

      <a
        *ngIf="hasRole(['Admin'])"
        routerLink="/civil-defense/districts"
        routerLinkActive="active"
        [matTooltip]="isCollapsed ? 'المراكز' : ''"
        matTooltipPosition="left"
      >
        <lucide-angular
          class="icon"
          [img]="MapPin"
          [size]="18"
        ></lucide-angular>
        <span class="label">المراكز</span>
      </a>

      <a
        *ngIf="hasRole(['DataEntry'])"
        routerLink="/civil-defense/licensing-processes"
        routerLinkActive="active"
        [matTooltip]="isCollapsed ? 'تراخيص المحال' : ''"
        matTooltipPosition="left"
      >
        <lucide-angular class="icon" [img]="Store" [size]="18"></lucide-angular>
        <span class="label">تراخيص المحال</span>
      </a>

      <a
        *ngIf="hasRole(['Admin'])"
        routerLink="/civil-defense/shop-licenses"
        routerLinkActive="active"
        [matTooltip]="isCollapsed ? 'التراخيص' : ''"
        matTooltipPosition="left"
      >
        <lucide-angular
          class="icon"
          [img]="FileCheck"
          [size]="18"
        ></lucide-angular>
        <span class="label">التراخيص</span>
      </a>

      <a
        *ngIf="hasRole(['Inspector'])"
        routerLink="/civil-defense/inspection"
        routerLinkActive="active"
        [matTooltip]="isCollapsed ? 'المعاينات' : ''"
        matTooltipPosition="left"
      >
        <lucide-angular
          class="icon"
          [img]="ClipboardCheck"
          [size]="18"
        ></lucide-angular>
        <span class="label">المعاينات</span>
      </a>

      <a
        *ngIf="hasRole(['FinalApprover'])"
        routerLink="/civil-defense/final-approval"
        routerLinkActive="active"
        [matTooltip]="isCollapsed ? 'الموافقة النهائية' : ''"
        matTooltipPosition="left"
      >
        <lucide-angular
          class="icon"
          [img]="ShieldCheck"
          [size]="18"
        ></lucide-angular>
        <span class="label">الموافقة النهائية</span>
      </a>

      <a
        *ngIf="hasRole(['Archive'])"
        routerLink="/civil-defense/archive"
        routerLinkActive="active"
        [matTooltip]="isCollapsed ? 'الأرشيف العام' : ''"
        matTooltipPosition="left"
      >
        <lucide-angular
          class="icon"
          [img]="Archive"
          [size]="18"
        ></lucide-angular>
        <span class="label">الأرشيف العام</span>
      </a>
    </nav>

    <button
      *ngIf="!isCollapsed"
      mat-fab
      extended
      color="warn"
      class="logout-btn"
      type="button"
      (click)="logout()"
    >
      <lucide-angular [img]="LogOut" [size]="18"></lucide-angular>
      تسجيل الخروج
    </button>

    <button
      *ngIf="isCollapsed"
      mat-mini-fab
      color="warn"
      class="logout-btn-collapsed"
      type="button"
      (click)="logout()"
      matTooltip="تسجيل الخروج"
      matTooltipPosition="left"
    >
      <lucide-angular [img]="LogOut" [size]="18"></lucide-angular>
    </button>
  </aside>

  <main class="dashboard-main" [class.collapsed]="isCollapsed">
    <header class="dashboard-header">
      <div>
        <h2>{{ title }}</h2>
        <p>مرحبًا {{ username }}، يمكنك إدارة الطلبات والمعاينات من هنا</p>
      </div>

      <div class="header-actions">
        <div class="user-card">
          <div class="user-avatar">👤</div>
          <div>
            <span>مرحبًا</span>
            <strong>{{ username }}</strong>
          </div>
        </div>
      </div>
    </header>

    <section class="dashboard-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</section>
