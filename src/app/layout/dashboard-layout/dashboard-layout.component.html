<section class="dashboard-layout" dir="rtl">
  <aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-brand">
      <div class="logo">🛡️</div>
      <div class="brand-text">
        <h3>الحماية المدنية</h3>
        <span>لوحة التحكم</span>
      </div>
      <button class="collapse-btn" type="button" (click)="toggleSidebar()">
        <lucide-angular
          [img]="isCollapsed ? PanelRightOpen : PanelLeftOpen"
          [size]="18"
        ></lucide-angular>
      </button>
    </div>

    <nav class="sidebar-menu">
      <!-- إعدادات النظام الأساسية (Admin فقط) -->
      <a
        *ngIf="hasRole(['Admin'])"
        routerLink="/civil-defense/activity-types"
        routerLinkActive="active"
      >
        <span class="icon">⚙️</span>
        <span class="label">أنواع النشاط</span>
      </a>

      <a
        *ngIf="hasRole(['Admin'])"
        routerLink="/civil-defense/requesting-entities"
        routerLinkActive="active"
      >
        <span class="icon">🏢</span>
        <span class="label">الجهات الطالبة</span>
      </a>

      <a
        *ngIf="hasRole(['Admin'])"
        routerLink="/civil-defense/districts"
        routerLinkActive="active"
      >
        <span class="icon">📍</span>
        <span class="label">المراكز</span>
      </a>

      <!-- إضافة طلب ترخيص (DataEntry فقط) -->
      <a
        *ngIf="hasRole(['DataEntry'])"
        routerLink="/civil-defense/licensing-processes"
        routerLinkActive="active"
      >
        <span class="icon">🏪</span>
        <span class="label">تراخيص المحال</span>
      </a>

      <!-- ➕ الصفحة الجديدة: عرض تراخيص المحال (DataEntry و Admin) -->
      <a
        *ngIf="hasRole(['DataEntry', 'Admin'])"
        routerLink="/civil-defense/shop-licenses"
        routerLinkActive="active"
      >
        <span class="icon">📋</span>
        <span class="label">عرض تراخيص المحال</span>
      </a>

      <!-- المعاينات (Inspector فقط) -->
      <a
        *ngIf="hasRole(['Inspector'])"
        routerLink="/civil-defense/inspection"
        routerLinkActive="active"
      >
        <span class="icon">📝</span>
        <span class="label">المعاينات</span>
      </a>

      <!-- الموافقة النهائية (FinalApprover فقط) -->
      <a
        *ngIf="hasRole(['FinalApprover'])"
        routerLink="/civil-defense/final-approval"
        routerLinkActive="active"
      >
        <span class="icon">📊</span>
        <span class="label">الموافقة النهائية</span>
      </a>

      <!-- الأرشيف (Archive فقط) -->
      <a
        *ngIf="hasRole(['Archive'])"
        routerLink="/civil-defense/archive"
        routerLinkActive="active"
      >
        <span class="icon">🗂️</span>
        <span class="label">الأرشيف</span>
      </a>
    </nav>

    <button
      *ngIf="!isCollapsed"
      mat-fab
      extended
      color="warn"
      class="logout-btn"
      type="button"
      (click)="logout()"
    >
      <lucide-angular [img]="LogOut" [size]="18"></lucide-angular>
      تسجيل الخروج
    </button>

    <button
      *ngIf="isCollapsed"
      mat-mini-fab
      color="warn"
      class="logout-btn-collapsed"
      type="button"
      (click)="logout()"
    >
      <lucide-angular [img]="LogOut" [size]="18"></lucide-angular>
    </button>
  </aside>

  <main class="dashboard-main" [class.collapsed]="isCollapsed">
    <header class="dashboard-header">
      <div>
        <h2>{{ title }}</h2>
        <p>مرحبًا {{ username }}، يمكنك إدارة الطلبات والمعاينات من هنا</p>
      </div>

      <div class="header-actions">
        <div class="user-card">
          <div class="user-avatar">👤</div>
          <div>
            <span>مرحبًا</span>
            <strong>{{ username }}</strong>
          </div>
        </div>
      </div>
    </header>

    <section class="dashboard-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</section>
