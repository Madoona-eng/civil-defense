<section class="dashboard-layout" dir="rtl">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">🛡️</div>
      <div>
        <h3>الحماية المدنية</h3>
        <span>لوحة التحكم</span>
      </div>
    </div>

    <nav class="sidebar-menu">
      <!-- إعدادات النظام الأساسية (Admin فقط) -->
      <a *ngIf="hasRole(['Admin'])" routerLink="/civil-defense/activity-types" routerLinkActive="active">
        <span>⚙️</span>
        أنواع النشاط
      </a>

      <a *ngIf="hasRole(['Admin'])" routerLink="/civil-defense/requesting-entities" routerLinkActive="active">
        <span>🏢</span>
        الجهات
      </a>

      <a *ngIf="hasRole(['Admin'])" routerLink="/civil-defense/districts" routerLinkActive="active">
        <span>📍</span>
        المراكز / المناطق
      </a>

      <!-- إضافة طلب ترخيص (DataEntry فقط) -->
      <a *ngIf="hasRole(['DataEntry'])" routerLink="/civil-defense/licensing-processes" routerLinkActive="active">
        <span>🏪</span>
        تراخيص المحال
      </a>

      <!-- ➕ الصفحة الجديدة: عرض تراخيص المحال (DataEntry و Admin) -->
      <a *ngIf="hasRole(['DataEntry', 'Admin'])" routerLink="/civil-defense/shop-licenses" routerLinkActive="active">
        <span>📋</span>
        عرض تراخيص المحال
      </a>

      <!-- المعاينات (Inspector فقط) -->
      <a *ngIf="hasRole(['Inspector'])" routerLink="/civil-defense/inspection" routerLinkActive="active">
        <span>📝</span>
        المعاينات
      </a>

      <!-- الموافقة النهائية (FinalApprover فقط) -->
      <a *ngIf="hasRole(['FinalApprover'])" routerLink="/civil-defense/final-approval" routerLinkActive="active">
        <span>📊</span>
        الموافقة النهائية
      </a>

      <!-- الأرشيف (Archive فقط) -->
      <a *ngIf="hasRole(['Archive'])" routerLink="/civil-defense/archive" routerLinkActive="active">
        <span>🗂️</span>
        الأرشيف
      </a>
    </nav>

    <button class="logout-mobile" type="button" (click)="logout()">
      تسجيل الخروج
    </button>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div>
        <h2>{{ title }}</h2>
        <p>مرحبًا {{ username }}، يمكنك إدارة الطلبات والمعاينات من هنا</p>
      </div>

      <div class="header-actions">
        <div class="user-card">
          <div class="user-avatar">👤</div>
          <div>
            <span>مرحبًا</span>
            <strong>{{ username }}</strong>
          </div>
        </div>

        <button class="logout-btn" type="button" (click)="logout()">
          تسجيل الخروج
        </button>
      </div>
    </header>

    <section class="dashboard-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</section>
