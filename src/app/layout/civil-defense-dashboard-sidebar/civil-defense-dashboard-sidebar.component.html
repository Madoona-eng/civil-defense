<aside class="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div>
        <h3>الحماية المدنية</h3>
        <p>{{ userRole }}</p>
      </div>
    </div>

    <div class="user-meta">
      <span>👤</span>
      <strong>{{ userName }}</strong>
    </div>
  </div>

  <nav class="menu">
    <!-- لوحة الطلبات -->
    <button 
      type="button" 
      routerLink="/civil-defense/dashboard" 
      routerLinkActive="active">
      🏠 لوحة الطلبات
    </button>

    <!-- ➕ إضافة الصفحة الجديدة هنا -->
    <button 
      type="button" 
      *ngIf="hasRole(['DataEntry', 'Admin'])" 
      routerLink="/civil-defense/shop-licenses" 
      routerLinkActive="active">
      📋 عرض تراخيص المحال
    </button>

    <!-- إدارة التراخيص / الطلبات القديمة -->
    <button 
      type="button" 
      *ngIf="hasRole(['DataEntry'])" 
      routerLink="/civil-defense/licensing-processes" 
      routerLinkActive="active">
      📄 تراخيص المحال
    </button>

    <!-- المعاينات -->
    <button 
      type="button" 
      *ngIf="hasRole(['Inspector'])" 
      routerLink="/civil-defense/inspection" 
      routerLinkActive="active">
      🔍 المعاينات
    </button>

    <!-- الموافقة النهائية -->
    <button 
      type="button" 
      *ngIf="hasRole(['FinalApprover'])" 
      routerLink="/civil-defense/final-approval" 
      routerLinkActive="active">
      ✅ الموافقات
    </button>

    <!-- الأرشيف -->
    <button 
      type="button" 
      *ngIf="hasRole(['Archive'])" 
      routerLink="/civil-defense/archive" 
      routerLinkActive="active">
      🗂️ الأرشيف
    </button>

    <!-- أنواع النشاط -->
    <button 
      type="button" 
      *ngIf="hasRole(['Admin', 'DataEntry'])" 
      routerLink="/civil-defense/activity-types" 
      routerLinkActive="active">
      ⚙️ أنواع النشاط
    </button>
  </nav>

  <div class="stats">
    <div><span>إجمالي</span><strong>{{ totalRequests }}</strong></div>
    <div><span>جديد</span><strong>{{ newRequests }}</strong></div>
    <div><span>معاينات</span><strong>{{ inspectionRequests }}</strong></div>
    <div><span>موافقات</span><strong>{{ finalApprovalRequests }}</strong></div>
  </div>

  <button type="button" class="logout-btn" (click)="logoutRequested.emit()">
    تسجيل الخروج
  </button>
</aside>
