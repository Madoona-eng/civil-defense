<div class="archived-page" dir="rtl">
  <div class="page-header">
    <div>
      <h2>{{ 'archive.title' | t }}</h2>
      <p>{{ 'archive.description' | t }}</p>
    </div>
  </div>

  <section class="filters-card">
    <div class="filters-grid">
      <div class="form-group search-group">
        <input
          type="text"
          [(ngModel)]="filter.searchTerm"
          [placeholder]="'archive.searchPlaceholder' | t"
          (keyup.enter)="search()"
        />
      </div>

      <div class="filters-row">
        <div class="form-group">
          <label>{{ 'common.requestingEntity' | t }}</label>
          <select [(ngModel)]="filter.requestingEntityId">
            @for (item of requestingEntities; track item.id) {
              <option [value]="item.id">{{ item.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>{{ 'common.district' | t }}</label>
          <select [(ngModel)]="filter.districtId">
            @for (item of districts; track item.id) {
              <option [value]="item.id">{{ item.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>{{ 'common.activity' | t }}</label>
          <select [(ngModel)]="filter.activityTypeId">
            @for (item of activityTypes; track item.id) {
              <option [value]="item.id">{{ item.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>{{ 'archive.reviewStatus' | t }}</label>
          <select [(ngModel)]="filter.reviewStatus">
            <option value="Accepted">{{ 'review.accepted' | t }}</option>
            <option value="Rejected">{{ 'review.rejected' | t }}</option>
          </select>
        </div>
      </div>
    </div>

    <div class="filter-actions">
      <button type="button" class="search-btn" (click)="search()">{{ 'common.search' | t }}</button>
      <button type="button" class="reset-btn" (click)="resetFilters()">
        {{ 'archive.reset' | t }}
      </button>
    </div>
  </section>

  <app-list
    (viewRequested)="openDetailsPopup($event)"
    (deleteRequested)="openDeletePopup($event)"
  >
  </app-list>

  @if (isDetailsPopupOpen) {
    <div class="popup-backdrop" (click)="closeDetailsPopup()">
      <div class="popup-card" (click)="$event.stopPropagation()">
        <button type="button" class="popup-close" (click)="closeDetailsPopup()">
          ×
        </button>
        <app-details [id]="selectedId!"></app-details>
      </div>
    </div>
  }

  @if (isDeletePopupOpen) {
    <div class="popup-backdrop" (click)="closeDeletePopup()">
      <div class="popup-card delete-card" (click)="$event.stopPropagation()">
        <button type="button" class="popup-close" (click)="closeDeletePopup()">
          ×
        </button>
        <div class="delete-confirm">
          <h3>{{ 'archive.confirmDelete' | t }}</h3>
          <p>
            {{ 'archive.deletePrompt' | t }}
            <strong>{{ selectedItem?.establishmentName }}</strong
            >؟
          </p>
          <div class="delete-actions">
            <button type="button" class="delete-btn" (click)="confirmDelete()">
              {{ 'common.delete' | t }}
            </button>
            <button
              type="button"
              class="cancel-btn"
              (click)="closeDeletePopup()"
            >
              {{ 'common.cancel' | t }}
            </button>
          </div>
        </div>
      </div>
    </div>
  }
</div>
