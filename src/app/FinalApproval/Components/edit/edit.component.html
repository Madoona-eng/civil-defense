<div class="final-approval-edit" dir="rtl">
  <div class="form-header">
    <div>
      <h2>قرار الموافقة النهائية</h2>
      <p *ngIf="item">كود المعاملة: {{ item.transactionCode }}</p>
    </div>

    <button type="button" class="close-btn" (click)="cancel()">
      ×
    </button>
  </div>

  <div class="summary-card" *ngIf="item">
    <div>
      <span>اسم المنشأة</span>
      <strong>{{ item.establishmentName }}</strong>
    </div>

    <div>
      <span>العنوان</span>
      <strong>{{ item.establishmentAddress }}</strong>
    </div>

    <div>
      <span>نوع النشاط</span>
      <strong>{{ item.activityType }}</strong>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label>حالة القرار</label>
      <select [(ngModel)]="formModel.reviewStatus">
        <option value="Accepted">مقبول / اعتماد نهائي</option>
        <option value="Rejected">مرفوض</option>
      </select>
    </div>

    <div class="form-group">
      <label>هل تم السداد؟</label>
      <select [(ngModel)]="formModel.isPaid">
        <option [ngValue]="true">نعم</option>
        <option [ngValue]="false">لا</option>
      </select>
    </div>

    <div class="form-group full-width">
      <label>
        سبب الرفض
        <span *ngIf="formModel.reviewStatus === 'Rejected'" class="required">*</span>
      </label>

      <textarea
        rows="4"
        [(ngModel)]="formModel.rejectionNote"
        placeholder="اكتبي سبب الرفض في حالة رفض المعاملة"
      ></textarea>
    </div>

    <div class="form-group">
      <label>خطابات الجهة</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'entityLetters')"
      />
    </div>

    <div class="form-group">
      <label>مستندات الإثبات</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'proofDocuments')"
      />
    </div>

    <div class="form-group">
      <label>التقارير الهندسية</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'engineeringReports')"
      />
    </div>

    <div class="form-group">
      <label>تقارير المعاينة</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'inspectionReports')"
      />
    </div>

    <div class="form-group full-width">
      <label>مرفقات أخرى</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'otherAttachments')"
      />
    </div>
  </div>

  <div class="message error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="message success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <div class="form-actions">
    <button
      type="button"
      class="save-btn"
      (click)="save()"
      [disabled]="saving"
    >
      {{ saving ? 'جاري الحفظ...' : 'حفظ القرار' }}
    </button>

    <button type="button" class="cancel-btn" (click)="cancel()">
      إلغاء
    </button>
  </div>
</div>
