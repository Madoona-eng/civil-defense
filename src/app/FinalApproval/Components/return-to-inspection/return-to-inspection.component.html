<div class="return-popup" dir="rtl">
  <button type="button" class="close-btn" (click)="cancel()">
    ×
  </button>

  <div class="return-icon">↩️</div>

  <h2>{{ 'final.returnTitle' | t }}</h2>

  <p>
    {{ 'final.returnPrompt' | t }}
    <strong>{{ item?.establishmentName }}</strong>
    {{ 'common.step.inspection' | t }}؟
  </p>

  <div class="transaction-card" *ngIf="item">
    <span>{{ 'common.requestCode' | t }}</span>
    <strong>{{ item.transactionCode }}</strong>
  </div>

  <div class="note-box">
    <label>{{ 'final.returnReason' | t }}</label>

    <textarea
      rows="4"
      [(ngModel)]="noteContent"
      [placeholder]="'final.returnReasonPlaceholder' | t"
    ></textarea>
  </div>

  <div class="message error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="actions">
    <button
      type="button"
      class="return-action-btn"
      (click)="confirmReturn()"
      [disabled]="processing"
    >
      {{ processing ? ('final.processingReturn' | t) : ('final.confirmReturn' | t) }}
    </button>

    <button type="button" class="cancel-btn" (click)="cancel()">
      {{ 'common.cancel' | t }}
    </button>
  </div>
</div>
