<div class="confirm-dialog" dir="rtl">
  <div class="dialog-icon icon-move">
    <lucide-angular [img]="Undo2" [size]="28"></lucide-angular>
  </div>

  <mat-dialog-content>
    <h2 class="dialog-title">إرجاع المعاملة للمعاينة</h2>

    <p>
      هل أنت متأكد من إرجاع معاملة
      <strong>{{ data.item.establishmentName }}</strong>
      إلى خطوة إجراء المعاينة؟
    </p>

    <div class="transaction-card">
      <span>كود المعاملة</span>
      <strong dir="ltr">{{ data.item.transactionCode }}</strong>
    </div>

    <mat-form-field appearance="outline" class="reason-field">
      <mat-label>سبب الإرجاع *</mat-label>
      <textarea
        matInput
        rows="4"
        [formControl]="noteContent"
        placeholder="اكتب سبب الإرجاع لخطوة المعاينة..."
      ></textarea>
      <mat-error *ngIf="noteContent.hasError('required')">
        يجب إدخال السبب عند الإرجاع لخطوة المعاينة
      </mat-error>
    </mat-form-field>

    <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()" [disabled]="processing">إلغاء</button>
    <button mat-flat-button class="btn-save" (click)="onConfirm()" [disabled]="processing">
      {{ processing ? 'جاري الإرجاع...' : 'إرجاع للمعاينة' }}
    </button>
  </mat-dialog-actions>
</div>
