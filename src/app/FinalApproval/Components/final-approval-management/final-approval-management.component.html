<div class="final-approval-page" dir="rtl">

  <!-- كارت الفلاتر والبحث -->
  <section class="filters-card" dir="rtl">
    <div class="filters-row-primary">
      <mat-form-field
        appearance="outline"
        subscriptSizing="dynamic"
        class="form-group search-field"
      >
        <mat-label>بحث</mat-label>
        <input
          matInput
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="ابحث بكود المعاملة، اسم المنشأة، اسم مقدم الطلب..."
          (keyup.enter)="search()"
        />
        <lucide-angular
          matPrefix
          [img]="Search"
          [size]="16"
          class="field-prefix-icon"
        ></lucide-angular>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-group date-field">
        <mat-label>التاريخ من</mat-label>
        <input matInput [matDatepicker]="pickerFrom" [(ngModel)]="submissionDateFrom" />
        <mat-datepicker-toggle matIconSuffix [for]="pickerFrom"></mat-datepicker-toggle>
        <mat-datepicker #pickerFrom></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-group date-field">
        <mat-label>التاريخ إلى</mat-label>
        <input matInput [matDatepicker]="pickerTo" [(ngModel)]="submissionDateTo" />
        <mat-datepicker-toggle matIconSuffix [for]="pickerTo"></mat-datepicker-toggle>
        <mat-datepicker #pickerTo></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="filters-row-secondary">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-group">
        <mat-label>الجهة الطالبة</mat-label>
        <mat-select [(ngModel)]="requestingEntityId">
          <mat-option value="">كل الجهات</mat-option>
          <mat-option *ngFor="let entity of requestingEntities" [value]="entity.id">
            {{ entity.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-group">
        <mat-label>المركز</mat-label>
        <mat-select [(ngModel)]="districtId">
          <mat-option value="">كل المراكز</mat-option>
          <mat-option *ngFor="let district of districts" [value]="district.id">
            {{ district.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-group">
        <mat-label>نوع النشاط</mat-label>
        <mat-select [(ngModel)]="activityTypeId">
          <mat-option value="">كل الأنشطة</mat-option>
          <mat-option *ngFor="let activity of activityTypes" [value]="activity.id">
            {{ activity.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-group">
        <mat-label>الرأي</mat-label>
        <mat-select [(ngModel)]="opinion">
          <mat-option value="">جميع الحالات</mat-option>
          <mat-option *ngFor="let opt of opinionOptions" [value]="opt.value">
            {{ opt.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-group">
        <mat-label>حالة الطلب</mat-label>
        <mat-select [(ngModel)]="finalStatus">
          <mat-option value="">كل الحالات</mat-option>
          <mat-option *ngFor="let opt of finalStatusOptions" [value]="opt.value">
            {{ opt.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="filter-actions">
      <button type="button" class="filter-btn filter-btn--primary" (click)="search()">
        <lucide-angular [img]="Search" [size]="18"></lucide-angular>
        <span>بحث</span>
      </button>

      <button type="button" class="filter-btn filter-btn--ghost" (click)="resetFilters()">
        <lucide-angular [img]="RotateCcw" [size]="16"></lucide-angular>
        <span>إعادة ضبط</span>
      </button>
    </div>
  </section>

  <!-- الجدول -->
  <app-final-approval-list
    [items]="items"
    [isLoading]="isLoading"
    [errorMessage]="errorMessage"
    [pageNumber]="pageNumber"
    [pageSize]="pageSize"
    [totalCount]="totalCount"
    [archivingItemId]="archivingItemId"
    (pageChanged)="onPageChange($event)"
    (editRequested)="openEditPopup($event)"
    (returnRequested)="onReturn($event)"
    (archiveRequested)="onArchive($event)"
  ></app-final-approval-list>

  <!-- Popups -->
  <app-final-approval-process
    *ngIf="isEditPopupOpen"
    [item]="selectedApprovalItem"
    (saved)="onEditSaved()"
    (cancelled)="closeEditPopup()"
  ></app-final-approval-process>
</div>
