<div class="final-approval-page" dir="rtl">
  <div class="page-header">
    <div>
      <h2>الموافقة النهائية</h2>
      <p>عرض ومتابعة معاملات تراخيص المحال في مرحلة الموافقة النهائية.</p>
    </div>
  </div>

  <app-final-approval-list
    (detailsRequested)="openDetailsPopup($event)"
    (editRequested)="openEditPopup($event)"
    (deleteRequested)="openDeletePopup($event)"
  ></app-final-approval-list>

  <div
    class="popup-backdrop"
    *ngIf="isDetailsPopupOpen"
    (click)="closeDetailsPopup()"
  >
    <div class="popup-card details-popup-card" (click)="$event.stopPropagation()">
      <app-final-approval-details
        [processId]="selectedProcessId"
        (closed)="closeDetailsPopup()"
      ></app-final-approval-details>
    </div>
  </div>

  <div
    class="popup-backdrop"
    *ngIf="isEditPopupOpen"
    (click)="closeEditPopup()"
  >
    <div class="popup-card edit-popup-card" (click)="$event.stopPropagation()">
      <app-final-approval-edit
        [item]="selectedApprovalItem"
        (saved)="onEditSaved()"
        (cancelled)="closeEditPopup()"
      ></app-final-approval-edit>
    </div>
  </div>

  <div
    class="popup-backdrop"
    *ngIf="isDeletePopupOpen"
    (click)="closeDeletePopup()"
  >
    <div class="popup-card delete-popup-card" (click)="$event.stopPropagation()">
      <app-final-approval-delete
        [item]="selectedDeleteItem"
        (deleted)="onDeleteDone()"
        (cancelled)="closeDeletePopup()"
      ></app-final-approval-delete>
    </div>
  </div>
</div>
