<div class="modal-overlay" dir="rtl">
  <div class="delete-modal">
    
    <!-- Header -->
    <div class="modal-header">
      <div class="alert-icon">!</div>

      <div class="header-title">
        <span class="subtitle">{{ 'common.actionConfirmation' | t }}</span>
        <h2>{{ 'entity.delete' | t }}</h2>
      </div>

      <button type="button" class="close-btn" (click)="cancel()">&times;</button>
    </div>

    <!-- Inner Body -->
    <div class="modal-body">
      <div class="trash-icon">🗑️</div>

      <p class="confirm-text">
        {{ 'entity.deletePrompt' | t }}
        <span class="highlight">"{{ requestingEntity?.name }}"</span>؟
      </p>

      <div class="message error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Actions -->
      <div class="modal-actions">
        <button 
          type="button" 
          class="btn-delete" 
          (click)="confirmDelete()" 
          [disabled]="deleting"
        >
          {{ deleting ? ('common.deleting' | t) : ('common.confirmDelete' | t) }}
        </button>

        <button type="button" class="btn-cancel" (click)="cancel()">
          {{ 'common.cancel' | t }}
        </button>
      </div>
    </div>

  </div>
</div>
