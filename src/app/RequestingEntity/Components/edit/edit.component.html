<div class="modal-overlay" dir="rtl" (click)="cancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <div class="header-content-group">
        <div class="dialog-icon primary">
          <mat-icon>edit</mat-icon>
        </div>

        <div class="header-text">
          <span class="eyebrow">{{ 'entity.manage' | t }}</span>
          <h2>{{ 'entity.edit' | t }}</h2>
        </div>
      </div>

      <button type="button" class="btn-dialog-close" (click)="cancel()" [attr.aria-label]="'common.close' | t">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="dialog-body">
      <div class="loading-box" *ngIf="loading">
        <mat-icon class="spin-icon">sync</mat-icon>
        <span>{{ 'common.loadingDataWithEllipsis' | t }}</span>
      </div>

      <ng-container *ngIf="!loading">
        <div class="form-grid">
          <div class="form-group">
            <label for="entity-code">{{ 'entity.code' | t }}</label>
            <input
              id="entity-code"
              type="number"
              class="dialog-input"
              [(ngModel)]="formModel.code"
              name="code"
              [placeholder]="'entity.code' | t"
              disabled
            />
          </div>

          <div class="form-group">
            <label for="entity-name">{{ 'entity.name' | t }}</label>
            <input
              id="entity-name"
              type="text"
              class="dialog-input"
              [(ngModel)]="formModel.name"
              name="name"
              [placeholder]="'entity.exampleLocalUnit' | t"
            />
          </div>
        </div>

        <div class="message-banner success" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="message-banner error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </ng-container>
    </div>

    <div class="dialog-actions" *ngIf="!loading">
      <button type="button" class="btn-save" (click)="save()" [disabled]="saving">
        <span *ngIf="!saving">{{ 'common.saveEdit' | t }}</span>
        <span *ngIf="saving">{{ 'common.saving' | t }}</span>
      </button>

      <button type="button" class="btn-reset" (click)="cancel()">
        {{ 'common.cancel' | t }}
      </button>
    </div>
  </div>
</div>
