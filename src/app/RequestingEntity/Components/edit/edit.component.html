<div class="popup-container" dir="rtl">
  <!-- هيدر النافذة العلوي -->

  <!-- هيدر النافذة العلوي -->
  <div class="popup-header">
    <div class="header-right">
      <div class="header-icon">
        <!-- أيقونة قلم SVG مباشرة لضمان الظهور -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a16207" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </div>
      <div class="header-titles">
        <span class="sub-title">إدارة الجهات</span>
        <h2>تعديل جهة</h2>
      </div>
    </div>
    <button type="button" class="close-btn" (click)="cancel()">✕</button>
  </div>

  <!-- باقي الكود كما هو بدون تغيير... -->

  <!-- جسم النموذج والمدخلات -->
  <div class="form-body">
    <div class="loading-box" *ngIf="loading">
      جاري تحميل البيانات...
    </div>

    <ng-container *ngIf="!loading">
      <div class="form-grid">
        <div class="field">
          <label>كود الجهة</label>
          <input
            type="number"
            [(ngModel)]="formModel.code"
            name="code"
            placeholder="كود الجهة"
            disabled
          />
        </div>

        <div class="field">
          <label>اسم الجهة</label>
          <input
            type="text"
            [(ngModel)]="formModel.name"
            name="name"
            placeholder="مثال: الوحدة المحلية"
          />
        </div>
      </div>

      <div class="message success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="message error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="actions">
        <button type="button" class="save-btn" (click)="save()" [disabled]="saving">
          {{ saving ? 'جاري الحفظ...' : 'حفظ التعديل' }}
        </button>

        <button type="button" class="cancel-btn" (click)="cancel()">
          إلغاء
        </button>
      </div>
    </ng-container>
  </div>
</div>
