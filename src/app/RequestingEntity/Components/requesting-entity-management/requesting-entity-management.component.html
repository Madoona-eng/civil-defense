<div class="requesting-page" dir="rtl">

  <!-- PAGE HEADER -->
  <header class="page-header">
    <div class="header-content">
      <div class="header-icon">
        <mat-icon>account_balance</mat-icon>
      </div>
      <div class="header-text">
        <span class="eyebrow">{{ 'common.systemManagement' | t }}</span>
        <h1>{{ 'entity.manage' | t }}</h1>
        <p>{{ 'entity.description' | t }}</p>
      </div>
    </div>

    <button type="button" class="add-btn" (click)="openAddPopup()">
      <mat-icon class="add-symbol">add</mat-icon>
      <span>{{ 'entity.add' | t }}</span>
    </button>
  </header>

  <!-- MAIN CONTENT -->
  <main class="page-content">
    <section class="mat-table-container">
      <div class="table-header-row">
        <h3>{{ 'entity.listRegistered' | t }}</h3>
      </div>

      <div class="table-scroll">
        <app-requesting-entity-list
          (editRequested)="openEditPopup($event)">
        </app-requesting-entity-list>
      </div>
    </section>
  </main>

  <!-- ADD MODAL OVERLAY -->
  <div class="popup-backdrop" *ngIf="isAddPopupOpen" (click)="closeAddPopup()">
    <div (click)="$event.stopPropagation()" style="width: 100%; max-width: 520px;">
      <app-requesting-entity-add
        (saved)="onAddSaved()"
        (cancelled)="closeAddPopup()">
      </app-requesting-entity-add>
    </div>
  </div>

  <!-- EDIT MODAL OVERLAY -->
  <app-requesting-entity-edit
    *ngIf="isEditPopupOpen"
    [requestingEntityId]="selectedRequestingEntityId"
    (saved)="onEditSaved()"
    (cancelled)="closeEditPopup()">
  </app-requesting-entity-edit>

</div>
