<div class="popup-container" dir="rtl">
  <div class="popup-header">
    <div class="header-right">
      <div class="header-icon">+</div>
      <div class="header-titles">
        <span class="sub-title">{{ 'entity.manage' | t }}</span>
        <h2>{{ 'entity.add' | t }}</h2>
      </div>
    </div>
    <button type="button" class="close-btn" (click)="cancel()">✕</button>
  </div>

  <div class="form-body">
    <div class="form-grid">
     <div class="field">
  <label>{{ 'entity.code' | t }}</label>
  <input
    type="number"
    min="1"
    (keydown)="preventNegative($event)"
    [(ngModel)]="formModel.code"
    name="code"
    [placeholder]="'entity.exampleCode' | t"
  />
</div>

      <div class="field">
        <label>{{ 'entity.name' | t }}</label>
        <input
          type="text"
          [(ngModel)]="formModel.name"
          name="name"
          [placeholder]="'entity.exampleName' | t"
        />
      </div>
    </div>

    <div class="message success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="message error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="actions">
      <button type="button" class="save-btn" (click)="save()" [disabled]="saving">
        {{ saving ? ('common.saving' | t) : ('entity.save' | t) }}
      </button>

      <button type="button" class="cancel-btn" (click)="cancel()">
        {{ 'common.cancel' | t }}
      </button>
    </div>
  </div>
</div>
