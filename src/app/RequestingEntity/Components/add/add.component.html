<div class="dialog-card">
  <!-- HEADER -->
  <div class="dialog-header">
    <div class="header-content-group">
      <div class="dialog-icon primary">
        <mat-icon>add</mat-icon>
      </div>
      <div class="header-text">
        <span class="eyebrow">{{ 'entity.manage' | t }}</span>
        <h2>{{ 'entity.addNew' | t }}</h2>
      </div>
    </div>

    <button type="button" class="btn-dialog-close" (click)="cancel()" [attr.aria-label]="'common.close' | t">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- BODY -->
  <div class="dialog-body">
    <div class="form-grid">
      <!-- CODE -->
      <div class="form-group">
        <label for="entity-code">{{ 'entity.code' | t }}</label>
        <input
          id="entity-code"
          type="number"
          min="1"
          class="dialog-input"
          (keydown)="preventNegative($event)"
          [(ngModel)]="formModel.code"
          name="code"
          [placeholder]="'entity.exampleCode' | t"
        />
      </div>

      <!-- NAME -->
      <div class="form-group">
        <label for="entity-name">{{ 'entity.name' | t }}</label>
        <input
          id="entity-name"
          type="text"
          class="dialog-input"
          [(ngModel)]="formModel.name"
          name="name"
          [placeholder]="'entity.exampleName' | t"
        />
      </div>
    </div>

    <!-- MESSAGES -->
    <div class="message-banner success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="message-banner error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="dialog-actions">
    <button
      type="button"
      class="btn-save"
      (click)="save()"
      [disabled]="saving"
    >
      {{ saving ? ('common.saving' | t) : ('entity.save' | t) }}
    </button>

    <button
      type="button"
      class="btn-reset"
      (click)="cancel()"
    >
      {{ 'common.cancel' | t }}
    </button>
  </div>
</div>
