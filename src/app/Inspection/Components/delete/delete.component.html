<div class="delete-popup" dir="rtl">
  <button type="button" class="close-btn" (click)="cancel()">
    ×
  </button>

  <div class="delete-icon">🗑️</div>

  <h2>حذف معاملة المعاينة</h2>

  <p>
    هل أنتِ متأكدة من حذف معاملة
    <strong>{{ item?.establishmentName }}</strong>؟
  </p>

  <div class="transaction-card" *ngIf="item">
    <span>كود المعاملة</span>
    <strong>{{ item.transactionCode }}</strong>
  </div>

  <div class="message error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="actions">
    <button
      type="button"
      class="delete-action-btn"
      (click)="confirmDelete()"
      [disabled]="deleting"
    >
      {{ deleting ? 'جاري الحذف...' : 'نعم، حذف' }}
    </button>

    <button type="button" class="cancel-btn" (click)="cancel()">
      إلغاء
    </button>
  </div>
</div>
