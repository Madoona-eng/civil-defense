<div class="inspection-form" dir="rtl">
  <div class="form-header">
    <div>
      <h2>تسجيل المعاينة</h2>
      <p *ngIf="item">كود المعاملة: {{ item.transactionCode }}</p>
    </div>

    <button type="button" class="close-btn" (click)="cancel()">
      ×
    </button>
  </div>

  <div class="summary-card" *ngIf="item">
    <div>
      <span>اسم المنشأة</span>
      <strong>{{ item.establishmentName }}</strong>
    </div>

    <div>
      <span>العنوان</span>
      <strong>{{ item.establishmentAddress }}</strong>
    </div>

    <div>
      <span>نوع النشاط</span>
      <strong>{{ item.activityType }}</strong>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label>اسم المعاين</label>
      <input
        type="text"
        [(ngModel)]="formModel.inspectorName"
        placeholder="أدخل اسم المعاين"
      />
    </div>

    <div class="form-group">
      <label>الرأي</label>
      <select [(ngModel)]="formModel.opinion">
        <option value="Compliant">مطابق / مستوفي</option>
        <option value="NonCompliant">غير مطابق / غير مستوفي</option>
      </select>
    </div>

    <div class="form-group full-width">
      <label>
        ملاحظات المعاينة
        <span *ngIf="formModel.opinion === 'NonCompliant'" class="required">*</span>
      </label>

      <textarea
        rows="4"
        [(ngModel)]="formModel.inspectionNote"
        placeholder="اكتبي سبب عدم الاستيفاء أو ملاحظات المعاينة"
      ></textarea>
    </div>

    <div class="form-group">
      <label>خطابات الجهة</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'entityLetters')"
      />
    </div>

    <div class="form-group">
      <label>مستندات الإثبات</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'proofDocuments')"
      />
    </div>

    <div class="form-group">
      <label>التقارير الهندسية</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'engineeringReports')"
      />
    </div>

    <div class="form-group">
      <label>تقارير المعاينة</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'inspectionReports')"
      />
    </div>

    <div class="form-group full-width">
      <label>مرفقات أخرى</label>
      <input
        type="file"
        multiple
        (change)="onFilesSelected($event, 'otherAttachments')"
      />
    </div>
  </div>

  <div class="message error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="message success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <div class="form-actions">
    <button
      type="button"
      class="save-btn"
      (click)="save()"
      [disabled]="saving"
    >
      {{ saving ? 'جاري الحفظ...' : 'حفظ المعاينة' }}
    </button>

    <button type="button" class="cancel-btn" (click)="cancel()">
      إلغاء
    </button>
  </div>
</div>
