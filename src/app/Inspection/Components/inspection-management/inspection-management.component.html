<div class="inspection-page" dir="rtl">

  <app-inspection-list
    (editRequested)="openEditPopup($event)"
  ></app-inspection-list>

  <div
    class="popup-backdrop"
    *ngIf="isEditPopupOpen"
    (click)="closeEditPopup()"
  >
    <div class="popup-card process-popup-card" (click)="$event.stopPropagation()">
      <app-inspection-process
        [item]="selectedInspectionItem"
        (saved)="onEditSaved()"
        (cancelled)="closeEditPopup()"
      ></app-inspection-process>
    </div>
  </div>

</div>
