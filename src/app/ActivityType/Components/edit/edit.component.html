<div class="popup-form" dir="rtl">
  <div class="popup-header">
    <div>
      <h2>{{ 'activity.edit' | t }}</h2>
 
    </div>
  </div>

  <div class="form-card">
    <div class="loading-box" *ngIf="loading">
      {{ 'common.loadingDataWithEllipsis' | t }}
    </div>

    <ng-container *ngIf="!loading">
      <div class="form-grid">
        <div class="field">
          <label>{{ 'activity.code' | t }}</label>
          <input
            type="number"
            [(ngModel)]="formModel.code"
            name="code"
            [placeholder]="'common.exampleCode' | t"
            disabled
          />
        </div>

        <div class="field">
          <label>{{ 'activity.name' | t }}</label>
          <input
            type="text"
            [(ngModel)]="formModel.name"
            name="name"
            [placeholder]="'common.exampleActivity' | t"
          />
        </div>
      </div>

      <div class="message success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="message error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="actions">
        <button type="button" class="save-btn" (click)="save()" [disabled]="saving">
          {{ saving ? ('common.saving' | t) : ('common.saveEdit' | t) }}
        </button>

        <button type="button" class="cancel-btn" (click)="cancel()">
          {{ 'common.cancel' | t }}
        </button>
      </div>
    </ng-container>
  </div>
</div>
