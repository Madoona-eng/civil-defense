<div class="popup-form" dir="rtl">
  <div class="popup-header">
    <div>
      <h2>تعديل نوع النشاط</h2>
      <p>عدلي اسم نوع النشاط ثم اضغطي حفظ.</p>
    </div>
  </div>

  <div class="form-card">
    <div class="loading-box" *ngIf="loading">
      جاري تحميل البيانات...
    </div>

    <ng-container *ngIf="!loading">
      <div class="form-grid">
        <div class="field">
          <label>كود نوع النشاط</label>
          <input
            type="number"
            [(ngModel)]="formModel.code"
            name="code"
            placeholder="مثال: 20"
            disabled
          />
        </div>

        <div class="field">
          <label>اسم نوع النشاط</label>
          <input
            type="text"
            [(ngModel)]="formModel.name"
            name="name"
            placeholder="مثال: اشغال علاجي"
          />
        </div>
      </div>

      <div class="message success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="message error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="actions">
        <button type="button" class="save-btn" (click)="save()" [disabled]="saving">
          {{ saving ? 'جاري الحفظ...' : 'حفظ التعديل' }}
        </button>

        <button type="button" class="cancel-btn" (click)="cancel()">
          إلغاء
        </button>
      </div>
    </ng-container>
  </div>
</div>
