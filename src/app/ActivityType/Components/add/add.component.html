<div class="add-form" dir="rtl">

  <!-- =====================================================
       FORM FIELDS
  ====================================================== -->

  <div class="form-grid">

    <!-- CODE -->

    <div class="field">

      <label for="activity-code">
        كود نوع النشاط
      </label>

      <input
        id="activity-code"
        type="number"
        [(ngModel)]="formModel.code"
        name="code"
        placeholder="مثال: 20"
      />

    </div>


    <!-- NAME -->

    <div class="field">

      <label for="activity-name">
        اسم نوع النشاط
      </label>

      <input
        id="activity-name"
        type="text"
        [(ngModel)]="formModel.name"
        name="name"
        placeholder="مثال: اشغال علاجي"
      />

    </div>

  </div>


  <!-- =====================================================
       SUCCESS MESSAGE
  ====================================================== -->

  <div
    class="message success"
    *ngIf="successMessage"
  >
    {{ successMessage }}
  </div>


  <!-- =====================================================
       ERROR MESSAGE
  ====================================================== -->

  <div
    class="message error"
    *ngIf="errorMessage"
  >
    {{ errorMessage }}
  </div>


  <!-- =====================================================
       ACTIONS
  ====================================================== -->

  <div class="actions">

    <button
      type="button"
      class="save-btn"
      (click)="save()"
      [disabled]="saving"
    >

      <span *ngIf="!saving">
        حفظ نوع النشاط
      </span>

      <span *ngIf="saving">
        جاري الحفظ...
      </span>

    </button>


    <button
      type="button"
      class="cancel-btn"
      (click)="cancel()"
    >
      إلغاء
    </button>

  </div>

</div>
