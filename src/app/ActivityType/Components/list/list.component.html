<div class="table-card" dir="rtl">
  <div class="list-header">
    <div>
      <h3>قائمة أنواع النشاط</h3>
      <p>عرض جميع أنواع النشاط المسجلة في النظام.</p>
    </div>

    <button type="button" class="refresh-btn" (click)="loadActivityTypes()">
      <mat-icon>refresh</mat-icon>
      <span>تحديث</span>
    </button>
  </div>

  <div class="message error" *ngIf="errorMessage">
    <mat-icon>error_outline</mat-icon>
    <span>{{ errorMessage }}</span>
  </div>

  <div class="loading-box" *ngIf="isLoading">
    <mat-icon class="spin-icon">sync</mat-icon>
    <span>جاري تحميل البيانات...</span>
  </div>

  <div class="empty-box" *ngIf="!isLoading && activityTypes.length === 0">
    <mat-icon>inbox</mat-icon>
    <span>لا توجد أنواع نشاط مسجلة حتى الآن.</span>
  </div>

  <div class="mat-table-container" *ngIf="!isLoading && activityTypes.length > 0">
    <table class="mat-mdc-table">
      <thead>
        <tr class="mat-mdc-header-row">
          <th class="mat-mdc-header-cell">الكود</th>
          <th class="mat-mdc-header-cell">اسم نوع النشاط</th>
          <th class="mat-mdc-header-cell action-header-cell">الإجراءات</th>
        </tr>
      </thead>

      <tbody>
        <tr class="mat-mdc-row" *ngFor="let item of activityTypes">
          <td class="mat-mdc-cell">
            <span class="code-badge">{{ item.code }}</span>
          </td>
          <td class="mat-mdc-cell font-medium">{{ item.name }}</td>
          <td class="mat-mdc-cell action-cell">
            
            <!-- زر النقاط الثلاث -->
            <button
              type="button"
              class="btn-action-more"
              [matMenuTriggerFor]="actionMenu"
              aria-label="خيارات">
              <mat-icon>more_vert</mat-icon>
            </button>

            <!-- القائمة المنسدلة للخيارات -->
            <mat-menu #actionMenu="matMenu" xPosition="before" class="custom-action-menu">
              <button mat-menu-item (click)="requestEdit(item.id)">
                <mat-icon class="menu-icon edit-icon">edit</mat-icon>
                <span>تعديل</span>
              </button>
              <button mat-menu-item (click)="requestDelete(item)">
                <mat-icon class="menu-icon delete-icon">delete_outline</mat-icon>
                <span>حذف</span>
              </button>
            </mat-menu>

          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
