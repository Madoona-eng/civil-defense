<div class="delete-popup" dir="rtl">
  <div class="delete-icon">
    <span>🗑️</span>
  </div>

  <p class="delete-text">
    {{ 'activity.deletePrompt' | t }}
    <strong>"{{ activityType?.name }}"</strong>؟
  </p>

  <div class="message error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="actions">
    <button type="button" class="delete-btn" (click)="confirmDelete()" [disabled]="deleting">
      {{ deleting ? ('common.deleting' | t) : ('common.confirmDelete' | t) }}
    </button>

    <button type="button" class="cancel-btn" (click)="cancel()">{{ 'common.cancel' | t }}</button>
  </div>
</div>
