<div class="modal-overlay" dir="rtl">
  <div class="dialog-card">

    <!-- Header -->
    <div class="dialog-header">
      <div class="header-content-group">
        <div class="dialog-icon primary">
          <mat-icon>add_location_alt</mat-icon>
        </div>

        <div class="header-text">
          <span class="eyebrow">إدارة المراكز / المناطق</span>
          <h2>إضافة مركز / منطقة</h2>
        </div>
      </div>

      <button type="button" class="btn-dialog-close" (click)="cancel()" aria-label="إغلاق">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Body Content -->
    <div class="dialog-body">
      <div class="form-grid">
        <div class="form-group">
          <label>كود المركز / المنطقة</label>
          <input
            type="number"
            [(ngModel)]="formModel.code"
            name="code"
            class="dialog-input"
            placeholder="0"
          />
        </div>

        <div class="form-group">
          <label>اسم المركز / المنطقة</label>
          <input
            type="text"
            [(ngModel)]="formModel.name"
            name="name"
            class="dialog-input"
            placeholder="مثال: مركز المنيا"
          />
        </div>
      </div>

      <!-- Alerts -->
      <div class="message-banner success" *ngIf="successMessage">
        <mat-icon>check_circle</mat-icon>
        <span>{{ successMessage }}</span>
      </div>

      <div class="message-banner error" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>
    </div>

    <!-- Actions Footer -->
    <div class="dialog-actions">
      <button 
        type="button" 
        class="btn-reset" 
        (click)="cancel()">
        إلغاء
      </button>

      <button
        type="button"
        class="btn-save"
        (click)="save()"
        [disabled]="saving">
        {{ saving ? 'جاري الحفظ...' : 'حفظ المركز / المنطقة' }}
      </button>
    </div>

  </div>
</div>
