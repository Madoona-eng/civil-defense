<div class="delete-card-wrapper" dir="rtl">
  
  <!-- Header -->
  <div class="modal-header">
    <div class="header-right">
      <div class="header-icon">!</div>
      <div class="header-title">
        <span class="subtitle">{{ 'common.actionConfirmation' | t }}</span>
        <h2>{{ 'district.delete' | t }}</h2>
      </div>
    </div>

    <button type="button" class="close-btn" (click)="cancel()">&times;</button>
  </div>

  <!-- Inner Content Card -->
  <div class="delete-inner-card">
    <div class="trash-icon-wrapper">
      <span class="trash-icon">🗑️</span>
    </div>

    <p class="confirm-text">
      {{ 'district.deletePrompt' | t }}
      <strong class="highlight-name">"{{ district?.name }}"</strong>؟
    </p>

    <!-- Error Message -->
    <div class="message error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Actions -->
    <div class="actions">
      <button
        type="button"
        class="delete-btn"
        (click)="confirmDelete()"
        [disabled]="deleting"
      >
        {{ deleting ? ('common.deleting' | t) : ('common.confirmDelete' | t) }}
      </button>

      <button type="button" class="cancel-btn" (click)="cancel()">
        {{ 'common.cancel' | t }}
      </button>
    </div>
  </div>

</div>
