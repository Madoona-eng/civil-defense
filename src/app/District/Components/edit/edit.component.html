<div class="modal-overlay" dir="rtl">
  <div class="dialog-card">

    <!-- Header -->
    <div class="dialog-header">
      <div class="header-content-group">
        <div class="dialog-icon primary">
          <mat-icon>edit_location_alt</mat-icon>
        </div>

        <div class="header-text">
          <span class="eyebrow">{{ 'district.manage' | t }}</span>
          <h2>{{ 'district.edit' | t }}</h2>
        </div>
      </div>

      <button type="button" class="btn-dialog-close" (click)="cancel()" [attr.aria-label]="'common.close' | t">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Body Content -->
    <div class="dialog-body">
      <div class="loading-box" *ngIf="loading">
        <mat-icon class="spin-icon">sync</mat-icon>
        <span>{{ 'common.loadingDataWithEllipsis' | t }}</span>
      </div>

      <ng-container *ngIf="!loading">
        <div class="form-grid">
          <div class="form-group">
            <label>{{ 'district.code' | t }}</label>
            <input
              type="number"
              [(ngModel)]="formModel.code"
              name="code"
              class="dialog-input"
              placeholder="0"
              disabled
            />
          </div>

          <div class="form-group">
            <label>{{ 'district.name' | t }}</label>
            <input
              type="text"
              [(ngModel)]="formModel.name"
              name="name"
              class="dialog-input"
              [placeholder]="'district.example' | t"
            />
          </div>
        </div>

        <!-- Alerts -->
        <div class="message-banner success" *ngIf="successMessage">
          <mat-icon>check_circle</mat-icon>
          <span>{{ successMessage }}</span>
        </div>

        <div class="message-banner error" *ngIf="errorMessage">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>
      </ng-container>
    </div>

    <!-- Actions Footer -->
    <!-- Actions Footer -->
    <div class="dialog-actions" *ngIf="!loading">
      <button 
        type="button" 
        class="btn-reset" 
        (click)="cancel()">
        {{ 'common.cancel' | t }}
      </button>

      <button
        type="button"
        class="btn-save"
        (click)="save()"
        [disabled]="saving">
        {{ saving ? ('common.saving' | t) : ('common.saveEdit' | t) }}
      </button>
    </div>

  </div>
</div>
