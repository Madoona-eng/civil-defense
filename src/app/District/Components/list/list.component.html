<div class="table-card" dir="rtl">
  
  <!-- رأس القائمة وزر التحديث -->
  <div class="list-header">
    <div>
      <h3>{{ 'district.list' | t }}</h3>
      <p>{{ 'district.listDescription' | t }}</p>
    </div>

    <button type="button" class="refresh-btn" (click)="loadDistricts()">
      <mat-icon>refresh</mat-icon>
      <span>{{ 'common.refresh' | t }}</span>
    </button>
  </div>

  <!-- رسالة الخطأ -->
  <div class="message error" *ngIf="errorMessage">
    <mat-icon>error_outline</mat-icon>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- حالة التحميل -->
  <div class="loading-box" *ngIf="isLoading">
    <mat-icon class="spin-icon">sync</mat-icon>
    <span>{{ 'common.loadingDataWithEllipsis' | t }}</span>
  </div>

  <!-- حالة عدم وجود بيانات -->
  <div class="empty-box" *ngIf="!isLoading && districts.length === 0">
    <mat-icon>inbox</mat-icon>
    <span>{{ 'district.empty' | t }}</span>
  </div>

  <!-- جدول البيانات -->
  <div class="table-scroll-wrapper" *ngIf="!isLoading && districts.length > 0">
    <table class="mat-mdc-table">
      <thead>
        <tr class="mat-mdc-header-row">
          <th class="mat-mdc-header-cell">{{ 'common.code' | t }}</th>
          <th class="mat-mdc-header-cell">{{ 'district.name' | t }}</th>
          <th class="mat-mdc-header-cell action-header-cell">{{ 'common.actions' | t }}</th>
        </tr>
      </thead>

      <tbody>
        <tr class="mat-mdc-row" *ngFor="let item of districts">
          <!-- كود المركز -->
          <td class="mat-mdc-cell">
            <span class="code-badge">{{ item.code }}</span>
          </td>

          <!-- اسم المركز -->
          <td class="mat-mdc-cell font-medium">{{ item.name }}</td>

          <!-- الإجراءات -->
          <td class="mat-mdc-cell action-cell">
            <button
              type="button"
              class="btn-action-more"
              [matMenuTriggerFor]="actionMenu"
              [attr.aria-label]="'common.options' | t">
              <mat-icon>more_vert</mat-icon>
            </button>

            <!-- القائمة المنسدلة للخيارات -->
            <mat-menu #actionMenu="matMenu" xPosition="before" class="custom-action-menu">
              <button mat-menu-item (click)="requestEdit(item.id)">
                <mat-icon class="menu-icon edit-icon">edit</mat-icon>
                <span>{{ 'common.edit' | t }}</span>
              </button>
              <button mat-menu-item (click)="requestDelete(item)">
                <mat-icon class="menu-icon delete-icon">delete_outline</mat-icon>
                <span>{{ 'common.delete' | t }}</span>
              </button>
            </mat-menu>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
