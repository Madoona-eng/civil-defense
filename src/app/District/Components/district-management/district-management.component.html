<div class="district-page" dir="rtl">

  <!-- =====================================================
        PAGE HEADER
  ====================================================== -->
  <header class="page-header">
    <div class="header-content">
      <div class="header-icon">
        <mat-icon>location_city</mat-icon>
      </div>
      <div class="header-text">
        <span class="eyebrow">{{ 'common.systemManagement' | t }}</span>
        <h1>{{ 'district.manage' | t }}</h1>
        <p>{{ 'district.description' | t }}</p>
      </div>
    </div>

    <button type="button" class="add-btn" (click)="openAddPopup()">
      <mat-icon class="add-symbol">add</mat-icon>
      <span>{{ 'district.add' | t }}</span>
    </button>
  </header>

  <!-- =====================================================
        MAIN CONTENT
  ====================================================== -->
  <main class="page-content">
    <section class="mat-table-container">

      <div class="table-header-row">
        <h3>{{ 'district.listRegistered' | t }}</h3>
      </div>

      <div class="table-scroll">
        <app-district-list (editRequested)="openEditPopup($event)"></app-district-list>
      </div>

    </section>
  </main>

  <!-- =====================================================
        ADD DIALOG
  ====================================================== -->
  <app-district-add
    *ngIf="isAddPopupOpen"
    (saved)="onAddSaved()"
    (cancelled)="closeAddPopup()">
  </app-district-add>

  <!-- =====================================================
        EDIT DIALOG
  ====================================================== -->
  <app-district-edit
    *ngIf="isEditPopupOpen"
    [districtId]="selectedDistrictId"
    (saved)="onEditSaved()"
    (cancelled)="closeEditPopup()">
  </app-district-edit>

</div>
