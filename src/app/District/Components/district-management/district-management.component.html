<div class="district-page" dir="rtl">

  <!-- =====================================================
        PAGE HEADER
  ====================================================== -->
  <header class="page-header">
    <div class="header-content">
      <div class="header-icon">
        <mat-icon>location_city</mat-icon>
      </div>
      <div class="header-text">
        <span class="eyebrow">{{ 'common.systemManagement' | t }}</span>
        <h1>{{ 'district.manage' | t }}</h1>
        <p>{{ 'district.description' | t }}</p>
      </div>
    </div>

    <button type="button" class="add-btn" (click)="openAddPopup()">
      <mat-icon class="add-symbol">add</mat-icon>
      <span>{{ 'district.add' | t }}</span>
    </button>
  </header>

  <!-- =====================================================
        MAIN CONTENT (Mat-Table Container)
  ====================================================== -->
  <main class="page-content">
    <section class="mat-table-container">

      <div class="table-header-row">
        <h3>{{ 'district.listRegistered' | t }}</h3>
      </div>

      <div class="table-scroll">
        <app-district-list
          (editRequested)="openEditPopup($event)">
        </app-district-list>
      </div>

    </section>
  </main>

  <!-- =====================================================
        ADD MODAL
  ====================================================== -->
  <div class="popup-backdrop" *ngIf="isAddPopupOpen" (click)="closeAddPopup()">
  <div (click)="$event.stopPropagation()">
    <app-district-add
      (saved)="onAddSaved()"
      (cancelled)="closeAddPopup()">
    </app-district-add>
  </div>
</div>

<!-- =====================================================
      EDIT MODAL
====================================================== -->
  <!-- =====================================================
        EDIT MODAL
  ====================================================== -->
  <div class="popup-backdrop" *ngIf="isEditPopupOpen" (click)="closeEditPopup()">
    <div class="popup-card" (click)="$event.stopPropagation()">
      <div class="popup-header">
        <div class="popup-title">
          <div class="popup-icon edit-icon">
            <mat-icon>edit_location_alt</mat-icon>
          </div>
          <div class="popup-title-text">
            <span>{{ 'district.manageLabel' | t }}</span>
            <h2>{{ 'district.editName' | t }}</h2>
          </div>
        </div>

        <button type="button" class="popup-close" (click)="closeEditPopup()" [attr.aria-label]="'common.close' | t">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="popup-body">
        <app-district-edit
          [districtId]="selectedDistrictId"
          (saved)="onEditSaved()"
          (cancelled)="closeEditPopup()">
        </app-district-edit>
      </div>
    </div>
  </div>

</div>
